--- S09
## Problem
# Missing signs make roads less safe
12.6% :: of accidents caused by driver error are due to traffic-sign violations
- On poorly maintained roads, signs go missing.
- Driver-assist systems and autonomous vehicles rely on signs to read the road.
- Finding missing signs by hand is slow.
[A17] Two dashcam frames of the same kind of curve: one with its warning sign, one without.

--- S10 statement
## Problem
# How do you detect something that is not there?
- Detectors find objects. Here, the object is absent.
- No dataset of missing signs exists, so there is no ground truth.
- The only evidence is context: a curve, a gap in the median, a speed bump.
> Find the cue, then place the sign.

--- S11
## Prior work
# Missing objects with simple cues
| Dataset | Frames with missing objects | Public | Varied cues |
|---|---|---|---|
| Missing curbs (Tohme) | 1,086 | × | × |
| Missing pedestrians | < 475 | × | × |
| Missing barricades | 853 | × | × |
| **MTSVD (ours)** | **135K (2K videos)** | **✓** | **✓** |
> In prior datasets, the cue sits next to the object or always looks the same. A sign usually stands away from its cue, and each sign type has its own cue.
note: Sun et al. find missing curbs with a Siamese network on image and masked-image pairs. Chien et al. predict where pedestrians could stand, with an FCN on Cityscapes. Chian et al. annotate missing barricades on construction sites. Local context works for them. For signs it does not, because the sign is away from its cue.

--- S12 media
# MTSVD
## Missing Traffic Signs Video Dataset
[A10] Full-bleed dashcam loop. Annotated sign tracks appear, then a stretch where the cue is visible and the sign is missing.

--- S13
## Dataset
# MTSVD at a glance
10K :: traffic-sign tracks
60+ :: sign categories
2K :: clips with missing signs
20+ :: cue types
- Unconstrained Indian roads: night, rain, varied terrain
- The first public dataset for missing objects
[A19] Annotated frames: boxes on signs, red tags for attributes such as "tilted" or "occluded".
note: DDPAI X2S Pro dashcam, 2560 × 1440 at 25 fps. Each track is tagged for occlusion, tilt, damage, truncation, and non-standard signs. Cue intervals are labelled frame by frame, since some signs appear before their cue (for example, U-turn).

--- S14
## Method
# CueCAn: cue-driven contextual attention
> A cue breaks the pattern of the road. Fill it in from its surroundings, then measure what changed.
1. Fill each row and column of the feature map from its neighbours.
2. Subtract the filled map from the original. Road and sky cancel out; cues remain.
3. Merge the difference back into the features.
[A14] Feature map with a speed bump. A row fill sweeps across, the filled map is subtracted, and the bump glows in the difference map.
note: Average-pool to 8 rows. Learnable 3 × 3 or 5 × 5 convolutions with the centre row (or column) fixed to zero. Upsample, subtract from F, concatenate to 3C channels, Conv + ReLU back to C. Edge-only kernels, where only the boundary weights learn, work best. The units sit after VGG-19 blocks 3, 4, and 5.

--- S15
## Method
# Classify first, then localize
1. The encoder with CueCAn learns one bit per frame: is a cue present?
2. An FCN-8 decoder is added, and the whole network learns to segment where the sign belongs.
> Missing signs have no ground truth. We inpaint real signs out of the frame, and the erased region becomes the target.
[A18] Pipeline strip: frame with a sign, the sign inpainted away, encoder with CueCAn, decoder, predicted mask over the erased spot.
note: 12,500 frames in four balanced sets: sign with cue, cue with inpainted sign, sign without cue, and neither. Binary cross-entropy for classification, focal loss for segmentation.

--- S16
## Results
# The encoder learns to find cues
| Encoder | Precision | Recall | F1 |
|---|---|---|---|
| VGG-19 | 94.77 | 87.45 | 90.96 |
| **VGG-19 + CueCAn** | **97.96** | **93.22** | **95.53** |
> Trained with one yes/no label per frame, it still learns many cue types.
[A15] GradCAM side by side: the vanilla encoder misses the cue; CueCAn attends to the curve and the median gap.

| Method | Recall |
|---|---|
| SFC (Sun et al.) | 34.7 |
| FCN (Chien et al.) | 47.7 |
| **CueCAn** | **64.9** |

--- S33
## Problem
# How does a multimodal LLM use the image while it writes?
> "A wing would be a most mystifying structure if one did not know that birds flew."
~ H. B. Barlow
- The model writes one token at a time, over a growing context.
- At each step it chooses what to read: the image, the text, the instruction, or its own output.
[A30] A response types out word by word while the image and text glow as each word draws on them.

--- S34
## Prior work
# Prior work asks where; we ask when
- Interpretability studies isolate layers, heads, and circuits.
- Earlier blocking studies cut image attention for a single output token.
> We average over all layers and heads, and follow every decoding step.

--- S35
## Tasks
# Tasks that switch between modalities
[A32] One sample from each task, side by side.
+++
### Fruit-Math · new
A fruit image and an unrelated math puzzle. Name the fruit, then solve the puzzle.
~ The two inputs share no information, so each one's role can be traced on its own.
### VSR · from Mixed Signals
The image and caption disagree on a spatial relation. Report both.
### ChartQA
Two questions about one chart, in one response.
~ Models: LLaVA-OneVision 0.5B, 7B · Qwen2.5-VL 3B, 7B

--- S36
## Method
# Follow attention one token at a time
1. Split the context into chunks: image, text, instruction, previous output.
2. At each step, measure how much the current token attends to each chunk.
3. Subtract each chunk's mean so that changes stand out.
4. Tag output tokens by role, such as "fruit name" or "handoff", and average across the dataset.
[A31] Output tokens appear one by one; under each, a stacked bar shows attention split across chunks.
note: Attention is summed over a chunk's tokens and averaged over all layers and heads. Raw scores mislead: the first token gets about 0.3 of the attention, yet blocking it changes nothing. Hence the normalization.

--- S37
## Method
# Block it, then boost it
- **Block:** stop information flowing from a chunk at a chosen step.
- **Total blocking** cuts the flow to every later token. Lazy blocking cuts only the current one, so information leaks in through intermediate tokens.
- **Boost:** scale attention to one chunk at one step, then renormalize.
[A33] Attention mask grid. The causal triangle draws in grey, then the blocked region slides in red: first one row (lazy), then the full block (total).

--- S38
## Results
# Attention follows the task
- Image attention peaks while naming the fruit.
- Text attention peaks at the math answer.
- At the handoff, models revisit the instruction.
- Attention to their own output rises steadily.
> Reverse the task order and the peaks swap.
[A34] Bar chart by output role (intro, fruit, handoff, math), one bar per chunk, growing left to right as the sentence is written.
~ Same pattern in both model families and on ChartQA.

--- S39
## Results
# Blocking confirms it
| Image blocked while writing | LOV-0.5B | LOV-7B | QVL-3B | QVL-7B |
|---|---|---|---|---|
| Nothing | 65.1 | 64.9 | 64.8 | 65.3 |
| **The fruit name** | **31.1** | **15.0** | **37.3** | **28.5** |
| "The fruit in the image is" | 69.1 | 70.9 | 65.5 | 69.5 |
~ Fruit accuracy with total blocking.
- Block the instruction at the handoff: the math answer rate falls from 83.9% to 0.2% (LOV-7B).
- Block previous output: responses loop, "the fruit the fruit …"

--- S40
## Results
# Boost the right modality at the right step
| Model | Boost | Image | Text | Both |
|---|---|---|---|---|
| LOV-7B | none | 20.6 | 55.9 | 16.7 |
| LOV-7B | image, always | 17.7 | 15.6 | 11.5 |
| **LOV-7B** | **ours** | **53.9** | **73.5** | **48.0** |
| QVL-7B | none | 52.0 | 76.5 | 45.1 |
| QVL-7B | image, always | 40.2 | 53.9 | 30.4 |
| **QVL-7B** | **ours** | **61.8** | **81.4** | **55.9** |
~ VSR accuracy. Ours: boost the image at the first image-relation token, the text at the first text-relation token.
> LOV-7B reads the text even when stating the image relation. Targeted boosting adds 31.3 points.

## Results
# When the image is cut off
- **Language prior:** LOV-7B often answers "banana".
- **Leakage:** "The fruit in the image is money." (LOV-0.5B)
- **Denial:** "The fruit in the image is not applicable." (QVL-7B)

--- S42 content Summary
## Summary
# What we learned
- **Context:** CueCAn finds the cue and places the missing sign. MTSVD is the first public dataset for the task.
- **Reasoning:** under StrictVLE, video LLMs trail humans by a wide margin at binding who did what, and when.
- **Generation:** attention follows the task token by token, and boosting it at the right step helps.
